name: sensorlog_app
description: Aplikasi pencatat data lapangan (foto, GPS, kompas, kemiringan) berbasis Flutter dan Supabase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  provider: ^6.1.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  sensors_plus: ^6.1.0
  flutter_compass: ^0.8.1
  battery_plus: ^6.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  intl: ^0.20.3
  uuid: ^4.5.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
