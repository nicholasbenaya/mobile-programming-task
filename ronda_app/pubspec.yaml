name: ronda_app
description: "RondaDigital multi-tenant community patrol and security application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^23.0.4
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  geolocator: ^14.0.1
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  sqflite: ^2.4.6
  supabase_flutter: ^2.18.3
  table_calendar: ^3.3.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
